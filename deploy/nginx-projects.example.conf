# Add these locations inside the existing TLS server block for jarldev.com.
# Keep the current / location so the portfolio continues serving from /var/www/html.
#
# Each project gets its own nested prefix, e.g. /projects/medtryx/. The prefix is
# stripped before proxying, so Express still serves the app and its API from /,
# while the browser uses /projects/medtryx/ for assets, routes, and /api calls.

location = /projects/medtryx {
	return 308 /projects/medtryx/;
}

location ^~ /projects/medtryx/ {
	proxy_pass http://127.0.0.1:3001/;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
